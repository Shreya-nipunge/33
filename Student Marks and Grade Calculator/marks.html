<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        .container {
            width: 350px;
            max-width: 90%;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid black;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="container">

        <h2>Student Marks Calculator</h2>

        <input type="text" id="name"
               placeholder="Enter student name">

        <input type="number" id="m1"
               placeholder="JavaScript Marks">

        <input type="number" id="m2"
               placeholder="HTML Marks">

        <input type="number" id="m3"
               placeholder="CSS Marks">

        <input type="number" id="m4"
               placeholder="React Marks">

        <input type="number" id="m5"
               placeholder="Node.js Marks">

        <br>

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>

    </div>

    <script>
        function calculate() {

            let name = document.getElementById("name").value;

            let m1 = document.getElementById("m1").value;
            let m2 = document.getElementById("m2").value;
            let m3 = document.getElementById("m3").value;
            let m4 = document.getElementById("m4").value;
            let m5 = document.getElementById("m5").value;

            if (name === "" || m1 === "" || m2 === "" ||
                m3 === "" || m4 === "" || m5 === "") {

                alert("Please fill all fields.");
                return;
            }

            m1 = Number(m1);
            m2 = Number(m2);
            m3 = Number(m3);
            m4 = Number(m4);
            m5 = Number(m5);

            if (m1 < 0 || m1 > 100 ||
                m2 < 0 || m2 > 100 ||
                m3 < 0 || m3 > 100 ||
                m4 < 0 || m4 > 100 ||
                m5 < 0 || m5 > 100) {

                alert("Marks must be between 0 and 100.");
                return;
            }

            let total = m1 + m2 + m3 + m4 + m5;

            let percentage = total / 5;

            let grade;
            let status;

            if (m1 < 40 || m2 < 40 || m3 < 40 ||
                m4 < 40 || m5 < 40) {

                grade = "F";
                status = "Fail";

            }
            else if (percentage >= 90) {
                grade = "A+";
                status = "Pass";
            }
            else if (percentage >= 80) {
                grade = "A";
                status = "Pass";
            }
            else if (percentage >= 70) {
                grade = "B";
                status = "Pass";
            }
            else if (percentage >= 60) {
                grade = "C";
                status = "Pass";
            }
            else {
                grade = "D";
                status = "Pass";
            }

            document.getElementById("result").innerHTML =
                "Student Name: " + name + "<br>" +
                "Total Marks: " + total + " / 500<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " + grade + "<br>" +
                "Status: " + status;

        }
    </script>
</body>
</html>
